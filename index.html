<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un Ramo de girasoles para ti</title>
<style>
  :root{
    --bg:#0A0A0A;
    --petal:#FFC93C;
    --petal-dark:#E8A31C;
    --center:#5B3A1E;
    --center-dot:#7A4E24;
    --stem:#3E6B2A;
    --leaf:#4C7A32;
    --ribbon:#E7E2D8;
    --ribbon-dark:#C9C2B2;
    --ink:#FFFFFF;
    --ink-soft:rgba(255,255,255,0.6);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:"Georgia","Iowan Old Style",serif;
  }
  .scene{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    background:radial-gradient(ellipse at 50% 60%, #161616 0%, #0A0A0A 65%, #000000 100%);
    overflow:hidden;
  }

  .title{
    position:absolute;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    color:var(--ink);
    text-align:center;
    z-index:5;
    pointer-events:none;
  }
  .title h1{
    margin:0;
    font-size:clamp(1.4rem, 4vw, 2.4rem);
    font-weight:400;
    letter-spacing:0.04em;
  }
  .title p{
    margin:.35em 0 0;
    font-size:clamp(0.75rem, 1.8vw, 0.95rem);
    font-style:italic;
    color:var(--ink-soft);
  }

  /* Bouquet anchor: every stem fans out from this point */
  .bouquet{
    position:absolute;
    left:50%;
    bottom:18%;
    width:0;
    height:0;
  }

  .stalk{
    position:absolute;
    bottom:0;
    left:0;
    transform-origin:bottom center;
    /* rotation angle set inline per flower via --angle */
    transform:rotate(var(--angle,0deg));
  }

  .stem-wrap{
    position:absolute;
    bottom:0;
    left:0;
    width:6px;
    margin-left:-3px;
    transform:scaleY(0);
    transform-origin:bottom center;
    animation:grow-stem 1.3s cubic-bezier(.3,.9,.3,1) forwards;
    animation-delay:var(--bloom-delay,0s);
  }
  @keyframes grow-stem{
    to{ transform:scaleY(1); }
  }

  .stem{
    width:6px;
    background:linear-gradient(to top, var(--stem), #4d7d34);
    border-radius:3px;
  }

  .leaf{
    position:absolute;
    width:26px;
    height:14px;
    background:var(--leaf);
    border-radius:0 100% 0 100%;
    opacity:0;
    animation:leaf-in 0.6s ease-out forwards;
    animation-delay:var(--leaf-delay,0s);
  }
  @keyframes leaf-in{
    from{ opacity:0; transform:scale(0.2) rotate(var(--leaf-rot,0deg)); }
    to{ opacity:1; transform:scale(1) rotate(var(--leaf-rot,0deg)); }
  }

  .head{
    position:absolute;
    left:50%;
    transform:translateX(-50%) scale(0) rotate(calc(-1 * var(--angle,0deg)));
    width:var(--head-size,70px);
    height:var(--head-size,70px);
    animation:bloom 1s cubic-bezier(.2,1.4,.4,1) forwards;
    animation-delay:var(--head-delay,1.1s);
  }
  @keyframes bloom{
    0%{ transform:translateX(-50%) rotate(calc(-1 * var(--angle,0deg))) scale(0); }
    70%{ transform:translateX(-50%) rotate(calc(-1 * var(--angle,0deg))) scale(1.12); }
    100%{ transform:translateX(-50%) rotate(calc(-1 * var(--angle,0deg))) scale(1); }
  }

  .petals{
    position:absolute;
    inset:0;
    animation:spin 44s linear infinite;
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  .petal{
    position:absolute;
    left:50%;
    top:50%;
    width:22%;
    height:46%;
    background:linear-gradient(to top, var(--petal-dark), var(--petal));
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    transform-origin:50% 100%;
  }

  .center{
    position:absolute;
    left:50%;
    top:50%;
    width:56%;
    height:56%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 40% 35%, var(--center-dot), var(--center) 75%);
    border-radius:50%;
    box-shadow:inset 0 3px 6px rgba(0,0,0,0.5);
  }
  .center::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background-image:radial-gradient(circle, rgba(0,0,0,0.3) 1px, transparent 1.5px);
    background-size:7px 7px;
  }

  .sway{
    animation:sway var(--sway-dur,4.5s) ease-in-out infinite;
    animation-delay:var(--sway-delay,0s);
    transform-origin:bottom center;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-2.2deg); }
    50%{ transform:rotate(2.2deg); }
  }

  /* Ribbon tying the stems together */
  .ribbon{
    position:absolute;
    left:50%;
    bottom:18%;
    transform:translate(-50%, 40%);
    z-index:15;
    opacity:0;
    animation:ribbon-in 0.6s ease-out forwards;
    animation-delay:2.3s;
  }
  @keyframes ribbon-in{
    to{ opacity:1; }
  }
  .ribbon-band{
    width:70px;
    height:26px;
    background:linear-gradient(180deg, var(--ribbon), var(--ribbon-dark));
    border-radius:4px;
    margin:0 auto;
    box-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  .ribbon-loop{
    position:absolute;
    top:-6px;
    width:34px;
    height:34px;
    background:linear-gradient(180deg, var(--ribbon), var(--ribbon-dark));
    border-radius:50% 50% 50% 0;
    box-shadow:0 2px 5px rgba(0,0,0,0.4);
  }
  .ribbon-loop.left{ left:-8px; transform:rotate(-35deg); }
  .ribbon-loop.right{ right:-8px; transform:rotate(215deg); }
  .ribbon-tail{
    position:absolute;
    top:22px;
    width:10px;
    height:38px;
    background:linear-gradient(180deg, var(--ribbon-dark), var(--ribbon));
    clip-path:polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
  }
  .ribbon-tail.left{ left:20px; transform:rotate(8deg); }
  .ribbon-tail.right{ right:20px; transform:rotate(-8deg); }

  /* ---- Letrero editable ---- */
  .sign{
    position:absolute;
    right:6%;
    bottom:10%;
    z-index:30;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transform:translateY(10px) rotate(2deg);
    animation:sign-in 0.8s ease-out forwards;
    animation-delay:2.8s;
  }
  @keyframes sign-in{
    to{ opacity:1; transform:translateY(0) rotate(2deg); }
  }
  .sign-post{
    width:2px;
    height:30px;
    background:rgba(255,255,255,0.35);
  }
  .sign-board{
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.55);
    border-radius:4px;
    padding:6px 14px;
    max-width:150px;
  }
  .sign-board span{
    display:block;
    color:var(--ink);
    font-family:"Georgia",serif;
    font-size:0.8rem;
    line-height:1.3;
    text-align:center;
    word-wrap:break-word;
  }

  footer{
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%);
    font-size:0.68rem;
    color:rgba(255,255,255,0.35);
    z-index:5;
    font-family:sans-serif;
    letter-spacing:0.03em;
  }

  @media (prefers-reduced-motion: reduce){
    .sway, .petals{ animation:none !important; }
    .stem-wrap{ animation:none !important; transform:scaleY(1) !important; }
    .head{ animation:none !important; }
    .head{ transform:translateX(-50%) rotate(calc(-1 * var(--angle,0deg))) scale(1) !important; }
    .leaf{ animation:none !important; opacity:1 !important; }
    .sign, .ribbon{ animation:none !important; opacity:1 !important; }
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="title">
    <h1>Un Ramo de Girasoles</h1>
    <p>Para Ti</p>
  </div>

  <div class="bouquet" id="bouquet"></div>

  <div class="ribbon">
    <div class="ribbon-tail left"></div>
    <div class="ribbon-tail right"></div>
    <div class="ribbon-band"></div>
    <div class="ribbon-loop left"></div>
    <div class="ribbon-loop right"></div>
  </div>

  <!-- Letrero editable: cambia el texto en SIGN_TEXT dentro del <script> -->
  <div class="sign">
    <div class="sign-board"><span id="sign-text"></span></div>
    <div class="sign-post"></div>
  </div>

  <footer>hecho con cariño 🌻</footer>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN DEL LETRERO
   Cambia este texto por el que quieras mostrar en el cartel.
   ============================================================ */
const SIGN_TEXT = "🌻 Para Juliana 🌻";

document.getElementById('sign-text').textContent = SIGN_TEXT;

(function(){
  const bouquet = document.getElementById('bouquet');

  // Bouquet layout: flowers fan out from a single base point.
  // angle: rotation in degrees (negative = left, positive = right)
  // length: stem length in px, headSize: flower diameter in px
  const flowers = [
    { angle:-34, length:190, headSize:62 },
    { angle:-20, length:230, headSize:72 },
    { angle:-8,  length:200, headSize:60 },
    { angle:0,   length:255, headSize:82 },
    { angle:9,   length:205, headSize:64 },
    { angle:21,  length:235, headSize:74 },
    { angle:34,  length:195, headSize:60 },
    { angle:-27, length:165, headSize:50 },
    { angle:27,  length:170, headSize:52 },
  ];

  flowers.forEach((f, i)=>{
    const bloomOrder = (Math.abs(f.angle) / 34) * 0.5 + i * 0.06;
    const stemDelay = bloomOrder.toFixed(2);
    const headDelay = (parseFloat(stemDelay) + 0.95).toFixed(2);
    const leafDelay = (parseFloat(stemDelay) + 0.45).toFixed(2);
    const swayDur = (4 + Math.random()*2).toFixed(2);
    const swayDelay = (parseFloat(headDelay)+0.3).toFixed(2);

    const stalk = document.createElement('div');
    stalk.className = 'stalk';
    stalk.style.setProperty('--angle', f.angle + 'deg');
    stalk.style.zIndex = 100 - Math.abs(f.angle);

    const sway = document.createElement('div');
    sway.className = 'sway';
    sway.style.setProperty('--sway-dur', swayDur + 's');
    sway.style.setProperty('--sway-delay', swayDelay + 's');
    sway.style.position = 'relative';
    sway.style.width = '0';
    sway.style.height = f.length + 'px';

    const stemWrap = document.createElement('div');
    stemWrap.className = 'stem-wrap';
    stemWrap.style.height = f.length + 'px';
    stemWrap.style.setProperty('--bloom-delay', stemDelay + 's');

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.style.height = f.length + 'px';
    stemWrap.appendChild(stem);

    const leafL = document.createElement('div');
    leafL.className = 'leaf';
    leafL.style.bottom = (f.length*0.32) + 'px';
    leafL.style.left = '-24px';
    leafL.style.setProperty('--leaf-rot', '-20deg');
    leafL.style.setProperty('--leaf-delay', leafDelay + 's');
    stemWrap.appendChild(leafL);

    const leafR = document.createElement('div');
    leafR.className = 'leaf';
    leafR.style.bottom = (f.length*0.52) + 'px';
    leafR.style.left = '4px';
    leafR.style.setProperty('--leaf-rot', '200deg');
    leafR.style.setProperty('--leaf-delay', (parseFloat(leafDelay)+0.15) + 's');
    stemWrap.appendChild(leafR);

    const head = document.createElement('div');
    head.className = 'head';
    head.style.bottom = f.length + 'px';
    head.style.setProperty('--head-size', f.headSize + 'px');
    head.style.setProperty('--head-delay', headDelay + 's');
    head.style.setProperty('--angle', f.angle + 'deg');

    const petals = document.createElement('div');
    petals.className = 'petals';
    petals.style.animationDuration = (34 + Math.random()*20) + 's';
    const petalCount = 13;
    for(let p=0; p<petalCount; p++){
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.transform = `translate(-50%,-100%) rotate(${(360/petalCount)*p}deg)`;
      petals.appendChild(petal);
    }
    head.appendChild(petals);

    const center = document.createElement('div');
    center.className = 'center';
    head.appendChild(center);

    stemWrap.appendChild(head);
    sway.appendChild(stemWrap);
    stalk.appendChild(sway);
    bouquet.appendChild(stalk);
  });
})();
</script>
</body>
</html>
